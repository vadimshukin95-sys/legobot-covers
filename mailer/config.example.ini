[sender]
email = your.address@gmail.com
name = LegoBot
# reply_to = support@example.com
# unsubscribe_email = your.address@gmail.com

[smtp]
host = smtp.gmail.com
port = 465
# Пароль приложения Gmail (не обычный пароль!). Надёжнее задать через
# переменную окружения MAILER_PASSWORD и оставить строку закомментированной.
# password = abcd efgh ijkl mnop

[message]
subject = $name, новые обложки для наборов LEGO

[sending]
# Пауза между письмами, секунд. Gmail: ~500 писем в сутки на обычный аккаунт.
delay_seconds = 5
