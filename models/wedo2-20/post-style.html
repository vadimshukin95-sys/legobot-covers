<style>

<script>
(function(){
  if(!/^\/wedo-modeli\/./.test(location.pathname)) return;
  var SET='/lego-wedo-2/tproduct/4150854401-935571797982-nabor-instruktsii-wedo-20-20-24-proekta';
  function run(){
    var art=document.querySelector('.t-cms__page-container article.t-cms__page');
    if(!art) return false;
    var title=art.querySelector('.t-heading .t-cms__page__text, h1 .t-cms__page__text, .t-heading, h1');
    var name=title?(title.textContent||'').replace(/\s+из LEGO WeDo 2\.0\s*$/,'').trim():'';
    var head=art.querySelector('.t-cms__page__cell_txt');
    if(head && !document.querySelector('.lbp-crumbs')){
      var c=document.createElement('div');
      c.className='lbp-crumbs';
      c.innerHTML='<a href="/">Главная</a> › <a href="/lego-wedo-2">LEGO WeDo 2.0</a> › <a href="/wedo-modeli">Модели</a>'+(name?' › '+name.replace(/[<>&]/g,''):'');
      head.insertBefore(c,head.firstChild);
    }
    if(!document.querySelector('.lbp-cta')){
      var b=document.createElement('section');
      b.className='lbp-cta';
      b.innerHTML='<div class="lbp-cta__box"><div class="lbp-cta__title">Пошаговая инструкция к этой модели</div>'+
        '<p class="lbp-cta__text">Входит в набор WeDo 2.0 №20: 24 PDF-инструкции для базового набора 45300. Доступ приходит на почту сразу после оплаты.</p>'+
        '<a class="lbp-cta__btn" href="'+SET+'">Смотреть набор №20</a><br>'+
        '<a class="lbp-cta__more" href="/wedo-modeli">← Все модели WeDo 2.0</a></div>';
      var wrap=art.closest('.t-cms__page-wrapper')||art;
      wrap.parentNode.insertBefore(b,wrap.nextSibling);
    }
    return true;
  }
  var n=0,t=setInterval(function(){ if(run()||++n>40) clearInterval(t); },250);
})();
</script>
